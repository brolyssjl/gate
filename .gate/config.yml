# Gate configuration. Commands are the same trust class as npm scripts.
commands:
  build: "cargo build --release --manifest-path rust/Cargo.toml"
  test: "./scripts/test-with-report.sh"
  lint: "cargo clippy --all-targets --manifest-path rust/Cargo.toml -- -D warnings"
  # coverage: "<command>"
thresholds:
  # diff_coverage: 80   # uncomment once a coverage command is set
phases:
  plan: required
  implement: required
  test: required
integrations:
  agnosgram: off
  sdd: off
