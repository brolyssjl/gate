name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-05
        with:
          components: rustfmt, clippy
      - name: cargo fmt --check
        run: cargo fmt --check --manifest-path rust/Cargo.toml
      - name: cargo clippy
        run: cargo clippy --all-targets --manifest-path rust/Cargo.toml -- -D warnings
      - name: cargo test (unit + conformance)
        run: cargo test --manifest-path rust/Cargo.toml
      - name: cargo build --release
        run: cargo build --release --manifest-path rust/Cargo.toml
