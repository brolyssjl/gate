name: Release

# Fires when a version tag is pushed (e.g. `git tag v0.3.0 && git push --tags`).
# Builds, gates each platform's binary on the conformance suite running
# against that exact binary, and creates a GitHub release from the verified
# assets.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  version-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify tag / rust/Cargo.toml version agree
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version=$(grep -m1 '^version' rust/Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          echo "tag=$tag_version rust/Cargo.toml=$cargo_version"
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "::error::Version mismatch: tag=v$tag_version rust/Cargo.toml=$cargo_version"
            exit 1
          fi

  build-and-verify:
    needs: [version-guard]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: gate-linux-x64
          - os: macos-latest
            asset: gate-darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-05
      - name: cargo build --release
        run: cargo build --release --manifest-path rust/Cargo.toml
      - name: Conformance suite against the binary that will ship
        run: cargo test --manifest-path rust/Cargo.toml
        env:
          GATE_BIN: ${{ github.workspace }}/rust/target/release/gate
      - run: mv rust/target/release/gate "${{ matrix.asset }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: [build-and-verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate SHA256SUMS (install.sh verifies against this)
        run: |
          cd release-assets
          shopt -s nullglob
          assets=(*)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::No release assets produced"
            exit 1
          fi
          sha256sum "${assets[@]}" > SHA256SUMS
          cat SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          assets=(release-assets/*)
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" --generate-notes --verify-tag
