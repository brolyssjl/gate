name: Release

# Fires when a version tag is pushed (e.g. `git tag v0.3.0 && git push --tags`).
# Builds, gates each platform's binary on the conformance suite running
# against that exact binary, and creates a GitHub release from the verified
# assets.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  version-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag / rust/Cargo.toml version agree
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version=$(grep -m1 '^version' rust/Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          echo "tag=$tag_version rust/Cargo.toml=$cargo_version"
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "::error::Version mismatch: tag=v$tag_version rust/Cargo.toml=$cargo_version"
            exit 1
          fi

  build-and-verify:
    needs: [version-guard]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: gate-linux-x64
          - os: macos-latest
            asset: gate-darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: cargo build --release
        run: cargo build --release --manifest-path rust/Cargo.toml
      - name: Conformance suite against the binary that will ship
        run: cargo test --manifest-path rust/Cargo.toml
        env:
          GATE_BIN: ${{ github.workspace }}/rust/target/release/gate
      - run: mv rust/target/release/gate "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: [build-and-verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate SHA256SUMS (SEC-02/03 - install.sh verifies against this)
        run: |
          cd release-assets
          shopt -s nullglob
          assets=(*)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::No release assets produced"
            exit 1
          fi
          sha256sum "${assets[@]}" > SHA256SUMS
          cat SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          assets=(release-assets/*)
          gh release create "${{ github.ref_name }}" "${assets[@]}" --generate-notes --verify-tag
